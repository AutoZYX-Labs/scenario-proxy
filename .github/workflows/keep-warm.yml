# Community Cloud suspends an app that nobody has visited, and the next visitor
# is met with "This app has gone to sleep due to inactivity" inside the frame --
# arriving from a button on driveresearch.tech, that reads as broken.
#
# This opens a real session once a day, in a headless browser.
#
# An HTTP request will not do, and the first version of this job made that
# mistake: `curl` fetches Streamlit's static shell without ever invoking the
# Python process, which only runs once a **websocket** session is established.
# The app was pinged at 04:32 and had gone to sleep again by 08:22, because
# from Community Cloud's side nothing had visited it.
#
# Loading the page properly also gives a real health check, which the ping
# could not: the job fails if the app does not render, not merely if the edge
# stops answering.
name: keep-warm

on:
  schedule:
    # 04:17 UTC. Not on the hour -- GitHub queues scheduled jobs and the top of
    # the hour is its busiest slot, so this typically runs around :30.
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a browser
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Open the app and hold a session open
        run: |
          python - <<'PY'
          import re
          import sys
          import time
          from playwright.sync_api import sync_playwright

          URL = ("https://scenario-engine.streamlit.app/"
                 "?embed=true&embed_options=light_theme")

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()

              # The websocket is the whole point. An HTTP request fetches the
              # shell and never starts the Python process; Streamlit only runs
              # the script once a session is established over this socket, and
              # that is what Community Cloud counts as a visit.
              sockets = []
              page.on("websocket", lambda ws: sockets.append(ws.url))

              page.goto(URL, wait_until="domcontentloaded", timeout=120_000)

              # If it has already slept, the page is Community Cloud's dialog
              # and it waits for a *click*; loading the URL is not enough.
              try:
                  wake = page.get_by_role("button", name=re.compile(
                      "get this app back up", re.I))
                  if wake.count():
                      print("it was asleep; waking it")
                      wake.first.click()
              except Exception:
                  pass

              # Not a selector. Community Cloud serves a wrapper that *iframes*
              # the app -- which is why its badge and bottom bar sit outside the
              # app's DOM, and why waiting for the app's own heading in the main
              # frame timed out for eight minutes against a page that had
              # rendered perfectly well.
              deadline = time.time() + 480
              while time.time() < deadline and not sockets:
                  page.wait_for_timeout(2_000)

              if not sockets:
                  page.screenshot(path="failure.png", full_page=True)
                  print("::error::no websocket opened, so no session started")
                  print("   frames seen: %s" % [f.url for f in page.frames])
                  browser.close()
                  sys.exit(1)

              print("session open:", sockets[0])
              # Let the script actually run before dropping the connection.
              page.wait_for_timeout(20_000)
              browser.close()
          PY

      - name: Keep the screenshot when it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure
          path: failure.png
          if-no-files-found: ignore
