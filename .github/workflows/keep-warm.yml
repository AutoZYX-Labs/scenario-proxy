# Community Cloud suspends an app that has not been visited for a while, and
# the next visitor is met with "This app has gone to sleep due to inactivity"
# inside the frame -- which, arriving from a button on driveresearch.tech,
# reads as broken. This is a daily request so that never happens.
#
# Once a day. The idle threshold is not documented anywhere Streamlit publishes,
# but every account of it puts it in days rather than hours, so one request each
# morning should sit comfortably inside it -- and it is about as little
# synthetic traffic as the job can send and still do its work.
name: keep-warm

on:
  schedule:
    # 04:17 UTC. Not on the hour, because GitHub queues scheduled jobs and the
    # top of the hour is its busiest slot; and early, so the app is warm before
    # anyone is likely to follow the button from driveresearch.tech.
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the app
        run: |
          # The embed URL, not the bare one: a direct visit answers 303 through
          # a session handshake, which would make a healthy app look broken.
          URL="https://scenario-engine.streamlit.app/?embed=true&embed_options=light_theme"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::the edge did not answer 200 -- the app may be renamed or removed"
            exit 1
          fi
          # A 200 here is Streamlit's *shell*, not the app. There is no
          # anonymous endpoint that reports whether the Python process booted:
          # /healthz is Community Cloud's proxy and /_stcore/health redirects
          # to the session handshake. So this job keeps the app from idling and
          # catches the URL disappearing -- it is not an uptime check, and a
          # green run does not mean the app runs.
