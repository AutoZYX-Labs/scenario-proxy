<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario Platform · DRIVEResearch</title>
  <meta name="description" content="DRIVEResearch scenario platform — browse, compose and export naturalistic driving scenarios as OpenSCENARIO.">
  <meta property="og:title" content="Scenario Platform · DRIVEResearch">
  <meta property="og:description" content="DRIVEResearch scenario platform — browse, compose and export naturalistic driving scenarios as OpenSCENARIO.">
  <meta property="og:image" content="https://driveresearch.tech/images/logo-square.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://scenario.driveresearch.tech/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="https://driveresearch.tech/images/logo-square.png" type="image/png">
  <link rel="canonical" href="https://scenario.driveresearch.tech/">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0f1923; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #faf9f5; pointer-events: none; z-index: 1; }
    #loading .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.15); border-top-color: #c85a3a; border-radius: 50%; animation: spin 0.9s linear infinite; }
    #loading span { margin-left: 12px; font-size: 14px; letter-spacing: 0.5px; opacity: 0.8; }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe.ready + #loading { display: none; }
  </style>
</head>
<body>
  <!-- Community Cloud has no custom-domain support: apps are routed by
       subdomain at *.streamlit.app, so a request arriving with
       Host: scenario.driveresearch.tech matches no app. The iframe is what
       keeps this address in the visitor's address bar. Same arrangement as
       data.driveresearch.tech. -->
  <iframe
    id="app"
    src="https://scenario-engine.streamlit.app/?embed=true&embed_options=show_toolbar,light_theme&utm_source=driveresearch.tech"
    title="DRIVEResearch Scenario Platform"
    allow="fullscreen"
    onload="this.classList.add('ready')"></iframe>
  <div id="loading"><div class="spinner"></div><span>Loading scenario platform…</span></div>
  <script>
    // Community Cloud sleeps idle apps and wakes them on first request, which
    // can take longer than a load event suggests. 25s, not 15 as the sister
    // page uses, because a cold Streamlit start is slower than a warm HF one.
    setTimeout(function () {
      var f = document.getElementById('app');
      if (!f.classList.contains('ready')) {
        window.location.replace('https://scenario-engine.streamlit.app/');
      }
    }, 25000);
  </script>
</body>
</html>
